name: Verify revenue-goal answers and Proto package
on:
  push:
    branches:
      - codex/verify-genstudio-questions-nov20
permissions:
  contents: read
jobs:
  proto:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the Proto site twice
        run: |
          python3 canvas/build.py
          python3 build_site.py
          python3 canvas/build.py
          python3 build_site.py
          git diff --exit-code --stat
          git archive --format=zip -o "$RUNNER_TEMP/sow-generator-proto-nov20-v8.zip" HEAD:site
          unzip -tq "$RUNNER_TEMP/sow-generator-proto-nov20-v8.zip"
      - name: Package Adobe Proto with index.html at the root
        uses: actions/upload-artifact@v4
        with:
          name: sow-generator-proto-nov20-v8
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Use the runner's Google Chrome for browser and video checks
        run: |
          npm install --prefix "$RUNNER_TEMP/sow-browser" --no-audit --no-fund playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/sow-browser/node_modules" >> "$GITHUB_ENV"
          export PROTO_CHROME_BINARY="$(command -v google-chrome || command -v google-chrome-stable)"
          "$PROTO_CHROME_BINARY" --version
          cat > "$RUNNER_TEMP/proto-chrome.cjs" <<'JS'
          const { chromium } = require('playwright');
          const launch = chromium.launch.bind(chromium);
          chromium.launch = (options = {}) => launch({...options, executablePath: process.env.PROTO_CHROME_BINARY});
          JS
          echo "PROTO_CHROME_BINARY=$PROTO_CHROME_BINARY" >> "$GITHUB_ENV"
      - name: Verify problems
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" canvas/test_problems.js
      - name: Verify agentic play
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_agentic_play.js
      - name: Verify step77
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_step77.js
      - name: Check question navigation at desktop and phone sizes
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_question_navigation.js
      - name: Check every focused product and the full opening map
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_map_first_page.js
      - name: Check opening older drafts
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_drafts.js
      - name: Check compact video posters, chapters, controls and mobile fallback
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_step83.js
      - name: Check the first page and its MP4 players in Google Chrome
        run: node --require "$RUNNER_TEMP/proto-chrome.cjs" test_first_page_rows.js
  download:
    needs: proto
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/verify-genstudio-questions-nov20
      - name: Save the verified Proto ZIP for download
        env:
          VERIFIED_SITE_TREE: 1770cc90d3ec38f1295e78789e8a9afd90418a2f
        run: |
          test "$(git rev-parse HEAD:site)" = "$VERIFIED_SITE_TREE"
          mkdir -p proto
          git archive --format=zip -o proto/sow-generator-proto-nov20-v8.zip HEAD:site
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          folder = pathlib.Path('site')
          expected = {p.relative_to(folder).as_posix() for p in folder.rglob('*') if p.is_file()}
          with zipfile.ZipFile('proto/sow-generator-proto-nov20-v8.zip') as archive:
              assert archive.testzip() is None
              assert {f.filename for f in archive.infolist() if not f.is_dir()} == expected
              for name in expected:
                  assert archive.read(name) == (folder / name).read_bytes(), name
          print(len(expected), 'files verified with index.html at the archive root')
          PY
          git add -f proto/sow-generator-proto-nov20-v8.zip
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Save the verified Adobe Proto download [skip ci] [skip netlify]"
          git push origin HEAD:refs/heads/codex/verify-genstudio-questions-nov20
