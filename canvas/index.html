:root{--red:#EB1000;--dred:#C40000;--ink:#1C1C1C;--ink2:#3A3A3A;--line:#D9D9D9;--soft:#F5F5F5;--font:'Source Sans 3',Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#fff;color:var(--ink);font:15px/1.45 var(--font);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.topline{height:4px;background:var(--red);flex:none}
.masthead{display:flex;align-items:center;gap:16px;padding:14px 30px;border-bottom:1px solid var(--line);flex:none}
.masthead img{width:96px;display:block}
.masthead .div{width:1px;height:30px;background:var(--line)}
.masthead .t{font-size:19px}
.tag{font-size:12px;font-weight:700;letter-spacing:1.2px;border:1.5px solid var(--ink);border-radius:3px;padding:1px 7px;text-transform:uppercase}
.masthead .sp{flex:1}
.btn{border:1.5px solid var(--ink);border-radius:4px;background:#fff;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn.redline{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:36px;padding:0 30px;border-bottom:1px solid var(--line);flex:none}
.tabs button{border:0;background:none;padding:14px 0 11px;font-size:17px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.toolbar{display:flex;align-items:center;gap:18px;padding:12px 30px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.add{background:var(--red);color:#fff;border:0;border-radius:4px;font-weight:700;font-size:16px;padding:11px 17px;display:flex;align-items:center;gap:8px}
.drop{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:8px 0;min-width:330px}
.menu[hidden]{display:none}
.menu .g{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:var(--ink2);padding:10px 18px 3px;text-transform:uppercase}
.menu button.it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 18px;font-size:16.5px;line-height:21px}
.menu button.it:hover,.menu button.it:focus-visible{background:var(--soft);outline:none}
.rate{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px}
.rate input{width:84px;border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px;font:inherit;font-weight:700;color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{border:0;border-right:1.5px solid var(--ink);background:#fff;padding:6px 13px;font-weight:600;font-size:15px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.total{margin-left:auto;border:1px solid var(--line);border-top:6px solid var(--red);border-radius:8px;padding:5px 18px 7px;min-width:390px}
.total .k{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--dred);text-transform:uppercase}
.total .big{font-size:36px;font-weight:700;line-height:40px}
.total .sub{font-size:15.5px}
.canvas{position:relative;flex:1;min-height:560px;background:var(--soft);overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1710px;height:640px;transform-origin:0 0;transition:transform .35s ease}
.stage>svg{position:absolute;left:0;top:0;overflow:visible}
.edge{fill:none;stroke:var(--ink2);stroke-width:2.5;transition:stroke-dashoffset .45s ease}
.edge.hot{stroke:var(--red);stroke-width:4}
.node{position:absolute;width:230px;height:66px;background:#fff;border:2px solid var(--ink);border-top:6px solid var(--red);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;text-align:center;font-weight:700;font-size:18.5px;line-height:21px;cursor:pointer;user-select:none}
.node:focus-visible{outline:3px solid var(--red);outline-offset:3px}

activation", "unit": "one-time", "low": 40, "base": 80, "high": 160, "url": "https://experienceleague.adobe.com/en/docs/experience-platform/destinations/ui/activate/activation-overview", "src": "Activation overview", "origin": "research", "scope": "Build the starting audiences, connect the agreed destinations, choose the identities and attributes to send, then schedule and test the first activations.", "evidence": "After you configure your destination, you can activate audiences in multiple ways"}, "RT05": {"id": "RT05", "name": "Governance, access and sandbox setup", "unit": "one-time", "low": 24, "base": 48, "high": 96, "url": "https://experienceleague.adobe.com/en/docs/experience-platform/rtcdp/home", "src": "Adobe Real-Time CDP Documentation", "origin": "research", "scope": "Set up roles, permissions and development and production sandboxes, apply data usage labels and policies to datasets, and confirm activations respect those policies.", "evidence": "assist your team with the right permissions, access controls, and sandbox configurations"}, "RT06": {"id": "RT06", "name": "Monthly audience and dataflow operations", "unit": "monthly", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/experience-platform/landing/getting-started/end-to-end-tutorial", "src": "Adobe Experience Platform end-to-end example workflow", "origin": "research", "scope": "Each month, review source and destination dataflows and alerts, fix failed runs, retire or refresh audiences, and add destinations as new use cases come in.", "evidence": "Experience Platform allows you to track how data is being processed through the use of dataflows"}, "JO01": {"id": "JO01", "name": "Access, sandbox and channel setup", "unit": "one-time", "low": 32, "base": 64, "high": 120, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer/using/get-started/by-role/administrator", "src": "Get started for system administrators", "origin": "research", "scope": "Set up roles and sandboxes, delegate the sending subdomains, and create the email and other channel configurations, IP pools and suppression and allowed lists.", "evidence": "Define all the technical parameters required for email, mobile messages, push notifications, web push, direct mail, and other channels"}, "JO02": {"id": "JO02", "name": "Journey events, data sources and actions", "unit": "one-time", "low": 40, "base": 80, "high": 160, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer/using/get-started/by-role/data-engineer", "src": "Get started for data engineer", "origin": "research", "scope": "Configure the identity namespaces, profile-enabled schemas and datasets the journeys need, then the journey events, data sources, custom actions and test profiles.", "evidence": "to be able to send messages in journeys, you must configure Data Sources, Events and Actions"}, "JO04": {"id": "JO04", "name": "Content templates and personalization", "unit": "one-time", "low": 40, "base": 64, "high": 120, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer/using/get-started/by-role/marketer", "src": "Get started for Marketers", "origin": "research", "scope": "Build reusable email and message templates and fragments, set up personalization and dynamic content, and preview rendering with test profiles.", "evidence": "Create reusable content templates and fragments to maintain brand consistency."}, "JO05": {"id": "JO05", "name": "First journeys and campaigns", "unit": "one-time", "low": 60, "base": 120, "high": 240, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer/using/orchestrate-journeys/create-journey/journey-gs", "src": "Create your first journey", "origin": "research", "scope": "Design, build, test and publish the starting journeys and campaigns, such as a welcome series, an abandoned cart journey and a scheduled campaign, with entry, wait and exit rules.", "evidence": "Build multi-step customer journeys to initiate a sequence of interactions, offers, and messages across channels in real time."}, "JO06": {"id": "JO06", "name": "Monthly journey operations and optimization", "unit": "monthly", "low": 24, "base": 40, "high": 72, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer/using/get-started/by-role/marketer", "src": "Get started for Marketers", "origin": "research", "scope": "Each month, review journey and campaign reports, fix errors and bottlenecks, run content experiments, and tune frequency and quiet hours rules.", "evidence": "Monitor and optimize. Track performance and improve results over time"}, "JO03": {"id": "JO03", "name": "IP warmup plan execution", "unit": "one-time", "low": 16, "base": 32, "high": 64, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer/using/configuration/implement-ip-warmup-plan/ip-warmup-gs", "src": "Get started with IP warmup plans", "origin": "research", "scope": "Create the warmup campaigns, load the warmup plan, run each phase and watch delivery and reputation signals until sending volume reaches its target.", "evidence": "To avoid being marked as spam, you can progressively increase the volume sent using the IP warmup plan feature."}, "C06": {"id": "C06", "name": "Audiences that act on the data", "unit": "one-time", "low": 24, "base": 48, "high": 96, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/cja-components/audiences/publish", "src": "Experience League: Publish CJA audiences", "origin": "sow"}, "CJ01": {"id": "CJ01", "name": "CJA data preparation in Experience Platform", "unit": "one-time", "low": 40, "base": 80, "high": 160, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/cja-overview/cja-b2c-overview/cja-getting-started", "src": "Quick start guide", "origin": "research", "scope": "Design the XDM schemas, create the datasets and set up ingestion for the channels CJA will report on, such as web, app, call center and point of sale data.", "evidence": "Use Adobe Experience Data Model (XDM) to standardize customer experience data and define schemas"}, "CJ02": {"id": "CJ02", "name": "Connections, data views and stitching", "unit": "one-time", "low": 40, "base": 80, "high": 160, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/cja-overview/cja-b2c-overview/cja-getting-started", "src": "Quick start guide", "origin": "research", "scope": "Create the connection with the right person ID for each dataset, turn on field-based or graph-based stitching in the connection where needed, and build data views with the client's components and settings.", "evidence": "A connection lets you integrate datasets from Adobe Experience Platform into Workspace."}, "CJ03": {"id": "CJ03", "name": "Adobe Analytics upgrade to CJA", "unit": "one-time", "low": 80, "base": 160, "high": 320, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/compare-aa-cja/upgrade-to-cja/cja-upgrade-recommendations", "src": "Upgrade from Adobe Analytics to Customer Journey Analytics", "origin": "research", "scope": "Plan the upgrade path, implement Web SDK alongside the Analytics source connector for history, port reporting API use and exports, and migrate projects and components.", "evidence": "a new implementation of the Experience Platform Web SDK, which is the preferred data collection method"}, "CJ04": {"id": "CJ04", "name": "Workspace projects and dashboards", "unit": "one-time", "low": 40, "base": 64, "high": 120, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/cja-overview/cja-b2c-overview/cja-getting-started", "src": "Quick start guide", "origin": "research", "scope": "Build the starting Analysis Workspace projects and dashboards for each team's priority questions, with cross-channel journeys, KPIs and segments.", "evidence": "analyze the data you have brought in using the power and flexibility of Analysis Workspace"}, "CJ05": {"id": "CJ05", "name": "User onboarding and traini tting-started-wknd-tutorial-develop/overview", "src": "Experience League: Get started with AEM Sites - WKND tutorial", "origin": "research", "scope": "Build the site from the AEM Project Archetype or a Site Template, with Core Components, editable templates, client-side libraries and the custom components the design needs.", "evidence": "The tutorial covers fundamental topics like project setup, Core Components, Editable Templates, Client-side libraries, and component development"}, "SI04": {"id": "SI04", "name": "Go-live checklist and cutover", "unit": "one-time", "low": 40, "base": 80, "high": 140, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/onboarding/journey/go-live-checklist", "src": "Experience League: Go-Live Checklist", "origin": "research", "scope": "Work through Adobe's go-live checklist: a production pipeline with functional and UI tests, Dispatcher validation, CDN, SSL and DNS, performance and security tests on stage, notification profiles and traffic filter rules.", "evidence": "Run an end-to-end production pipeline with functional and UI testing to ensure an always current AEM product experience."}, "SI05": {"id": "SI05", "name": "Author training on the Universal Editor", "unit": "one-time", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/implementing/developing/universal-editor/introduction", "src": "Experience League: Universal Editor Introduction", "origin": "research", "scope": "Train authors to edit pages and content in the Universal Editor and hand over authoring guides for the site's components and templates.", "evidence": "It enables authors to perform what-you-see-is-what-you-get (WYSIWYG) editing of any headless or headful experience."}, "SI06": {"id": "SI06", "name": "Monthly releases, monitoring and logs", "unit": "monthly", "low": 16, "base": 24, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/migration-journey/post-go-live", "src": "Experience League: Post Go-Live", "origin": "research", "scope": "Each month, ship code through Cloud Manager pipelines, check the automatic AEM version updates, review logs and the Developer Console, and fix issues found after go-live.", "evidence": "monitor for issues and improve performance after the migration is complete"}, "SI03": {"id": "SI03", "name": "Content migration with Content Transfer Tool", "unit": "one-time", "low": 60, "base": 120, "high": 240, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/migration-journey/cloud-migration/content-transfer-tool/overview-content-transfer-tool", "src": "Experience League: Overview to Content Transfer Tool", "origin": "research", "scope": "For clients moving from AEM on-premise or Adobe Managed Services: extract and ingest content with the Content Transfer Tool in Cloud Acceleration Manager, then run differential top-ups before go-live.", "evidence": "migration of existing content from a source AEM instance (on-premise or AMS) to the target AEM Cloud Service instance"}, "AS01": {"id": "AS01", "name": "DAM onboarding, users and access", "unit": "one-time", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/ai-in-aem/agentic-capabilities/brand-experience/onboarding/use-cases", "src": "Experience League: Onboarding Agentic Capabilities Overview", "origin": "research", "scope": "Add users to the Admin Console, create user groups and attach the AEM Assets product profiles, and confirm the Cloud Manager program and environments for the DAM.", "evidence": "Adds users to the Adobe Admin Console organization, creates user groups, and attaches product profiles to groups."}, "AS02": {"id": "AS02", "name": "Folder structure, tags and metadata forms", "unit": "one-time", "low": 40, "base": 72, "high": 140, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/ai-in-aem/agentic-capabilities/brand-experience/onboarding/use-cases", "src": "Experience League: Onboarding Agentic Capabilities Overview", "origin": "research", "scope": "Design the folder hierarchy under /content/dam, the controlled tag taxonomy and the custom metadata forms, so assets are findable and ready to reuse in every channel.", "evidence": "Designs and creates folder hierarchies under /content/dam and controlled tag taxonomies under /content/cq:tags"}, "AS03": {"id": "AS03", "name": "Asset and metadata migration", "unit": "one-time", "low": 40, "base": 80, "high": 200, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/assets/assets-view/bulk-import-assets-view", "src": "Experience League: Bulk import assets using Assets view", "origin": "research", "scope": "Bulk import the existing library from cloud storage (Azure, AWS, Google Cloud, Dropbox or OneDrive) and load metadata for existing assets from CSV files.", "evidence": "import large numbers of assets directly from an external data source into AEM Assets in a single, streamlined operation"}, "AS04": {"id": "AS04", "name": "Processing profiles and renditions", "unit": "one-time", "low": 16, "base": 32, "high": 64, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/assets/manage/add-assets", "src": "Experience League: Add your digital assets to Adobe Experience Manager.", "origin": "research", "scope": "Configure processing profiles on upload folders for the renditions, metadata and image processing each channel needs, plus any post-processing workflows.", "evidence": "Several asset processing profiles can be configured on the folder, into which assets are uploaded, to add specific metadata, renditions"}, "AS06": {"id": "AS06", "name": "Monthly DAM administration and reporting", "unit": "monthly", "low": 8, "base": 16, "high": 32, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/assets/admin/asset-reports", "src": "Experience League: Reports about usage and sharing", "origin": "research", "scope": "Each month, review asset reports on usage and sharing, tidy metadata and tags, update processing profiles and manage user access.", "evidence": "The reports provide useful information about your system’s usage, how users interact with assets, and which assets are shared."}, "AS05": {"id": "AS05", "name": "Content Hub portal for approved assets", "unit": "one-time", "low": 16, "base": 32, "high": 64, "url": "https://experienceleague.adobe.com/en/docs/experience-manager-cloud-service/content/assets/content-hub/deploy-content-hub", "src": "Experience League: Deploy Content Hub", "origin": "research", "scope": "Deploy Content Hub, set user, contributor and administrator roles, configure the portal, and set up the approval step that releases assets to it.", "evidence": "Only assets marked Approved on Experience Manager Assets as a Cloud Service become available for distribution on Content Hub"}, "JB01": {"id": "JB01", "name": "B2B schemas, XDM fields and events", "unit": "one-time", "low": 40, "base": 72, "high": 140, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer-b2b/user/get-started/admin-setup/setup-ultimate", "src": "Experience League: Setup checklist", "origin": "research", "scope": "Generate the B2B namespaces and schemas with Adobe's utility, choose the managed and relational XDM fields for journeys and personalization, and select the Experience Platform events journeys listen to.", "evidence": "Run the Namespaces and Schemas generation utility in Postman and confirm namespaces and schemas are created."}, "JB02": {"id": "JB02", "name": "Email domains and deliverability setup", "unit": "one-time", "low": 24, "base": 48, "high": 80, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer-b2b/user/get-started/admin-setup/setup-ultimate", "src": "Experience League: Setup checklist", "origin": "research", "scope": "In the attached Marketo Engage instance, set up tracking CNAMEs, branding domains, DKIM, SPF, DMARC and MX records and IP allowlists, then email settings and communication limits in the B2B Edition.", "evidence": "configure the email tracking and deliverability in the attached Marketo Engage production instance"}, "JB03": {"id": "JB03", "name": "Buying groups and solution interests", "unit": "one-time", "low": 32, "base": 56, "high": 100, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer-b2b/user/accounts/buying-groups/solution-interests", "src": "Experience League: Solution Interests", "origin": "research", "scope": "Define solution interests and role templates with sales, build account audiences, and run the buying group creation jobs that fill each buying group.", "evidence": "Before you create buying groups, you should know what you are selling and who you want to target."}, "JB04": {"id": "JB04", "name": "First account journeys and email content", "unit": "one-time", "low": 60, "base": 100, "high": 180, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer-b2b/user/journeys/journeys-overview", "src": "Experience League: Journey management", "origin": "research", "scope": "Build the first account journeys for acquisition or cross-sell, with personalized email templates, visual fragments and journey nodes, then test and publish them.", "evidence": "Tailor your journeys for each buying group and buying group member using automated engagement across email, SMS, events, and more."}, "JB05": {"id": "JB05", "name": "User roles, access and team enablement", "unit": "one-time", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer-b2b/user/get-started/admin-setup/setup-ultimate", "src": "Experience League: Setup checklist", "origin": "research", "scope": "Create the product profile and user groups in the Admin Console, configure B2B user roles, add users, and walk marketers through Adobe's onboarding guidance.", "evidence": "configure Journey Optimizer B2B Edition and Marketo Engage access for your team and users."}, "JB06": {"id": "JB06", "name": "Monthly buying group and journey reviews", "unit": "monthly", "low": 16, "base": 24, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/journey-optimizer-b2b/user/dashboards/intelligent-dashboard", "src": "Experience League: Intelligent Dashboard", "origin": "research", "scope": "Each month, review the Intelligent Dashboard and journey results, refresh buying groups and audiences, and tune journeys and content.", "evidence": "The Intelligent Dashboard provides a comprehensive view of buying group and account metrics, helping you to monitor and strategize"}, "EX01": {"id": "EX01", "name": "Accelerator access, roles and sandboxes", "unit": "one-time", "low": 8, "base": 16, "high": 32, "url": "https://experienceleague.adobe.com/en/docs/experimentation-accelerator/using/get-started/experiment-accelerator-access", "src": "Experience League: Journey Optimizer Experimentation Accelerator", "origin": "research", "scope": "Add the Experiment accelerator resource to roles with View Experiments or Manage Experiment Metadata, assign the sandboxes, and add users.", "evidence": "Add the Experiment accelerator resource, then select View Experiments and/or Manage Experiment Metada from the drop-down menu."}, "EX02": {"id": "EX02", "name": "Experiment program and hypothesis playbook", "unit": "one-time", "low": 24, "base": 40, "high": 72, "url": "https://experienceleague.adobe.com/en/docs/experimentation-accelerator/using/get-started/experiment-accelerator-best-practices", "src": "Experience League: Journey Optimizer Experimentation Accelerator best practices", "origin": "research", "scope": "Set up the client's testing playbook: hypothesis format, primary and secondary metrics, sample size and run time, segmentation rules and how learnings are recorded.", "evidence": "A strong hypothesis includes what you’re changing, what you expect to happen, and why."}, "EX03": {"id": "EX03", "name": "Hypotheses and treatment details per test", "unit": "one-time", "low": 8, "base": 16, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/experimentation-accelerator/using/monitor/experiment-accelerator-monitor", "src": "Experience League: Journey Optimizer Experimentation Accelerator monitor", "origin": "research", "scope": "Add a hypothesis and confirm the treatment details and screenshots for each running experiment, which the accelerator needs before it generates insights and opportunities.", "evidence": "for Experiment insights to be generated, you need to confirm hypothesis and treatment details and statistical significance to be reached."}, "EX05": {"id": "EX05", "name": "Training on insights and opportunities", "unit": "one-time", "low": 8, "base": 16, "high": 24, "url": "https://experienceleague.adobe.com/en/docs/experimentation-accelerator/using/monitor/experiment-accelerator-monitor", "src": "Experience League: Journey Optimizer Experimentation Accelerator monitor", "origin": "research", "scope": "Train marketers and analysts to read experiment outcomes, insights and AI opportunities, including learning and conversion potential, and to share results.", "evidence": "The Opportunities panel displays AI-generated recommendations designed to enhance test performance and align with broader business objectives and KPIs."}, "EX06": {"id": "EX06", "name": "Monthly experiment review and backlog", "unit": "monthly", "low": 8, "base": 16, "high": 32, "url": "https://experienceleague.adobe.com/en/docs/experimentation-accelerator/using/monitor/experiment-accelerator-monitor", "src": "Experience League: Journey Optimizer Experimentation Accelerator monitor", "origin": "research", "scope": "Each month, review the experiments list and KPIs, pick the opportunities worth testing next, and keep the test backlog and learnings log current.", "evidence": "The KPI section provides key metrics, including the total number of experiments created and the number currently in progress"}, "EX04": {"id": "EX04", "name": "Primary metrics from CJA or Adobe Analytics", "unit": "one-time", "low": 8, "base": 16, "high": 32, "url": "https://experienceleague.adobe.com/en/docs/experimentation-accelerator/using/monitor/experiment-accelerator-monitor", "src": "Experience League: Journey Optimizer Experimentation Accelerator monitor", "origin": "research", "scope": "Where CJA or Adobe Analytics is the reporting source, choose and import the primary metric for each experiment; changes stay in the accelerator.", "evidence": "Changing the primary metric applies to teams that use Customer Journey Analytics or Adobe Analytics as the reporting source"}, "CA01": {"id": "CA01", "name": "Content Analytics readiness and prerequisites", "unit": "one-time", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/content-analytics/configuration/configuration", "src": "Experience League: Configure Content Analytics", "origin": "research", "scope": "Confirm Web SDK or Mobile SDK data collection, allow-list the featurization service's user agent and IP, set CJA and data collection permissions, and agree which pages and assets to analyze.", "evidence": "You have allow-listed the User Agent and IP address for the featurization service that is used in Content Analytics."}, "CA02": {"id": "CA02", "name": "Guided configuration and Tags rollout", "unit": "one-time", "low": 32, "base": 64, "high": 120, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/content-analytics/configuration/configuration", "src": "Experience League: Configure Content Analytics", "origin": "research", "scope": "Run the guided configuration (sandbox, connection, data views, web and mobile channels, experience capture, exclusion rules that keep personal data out), implement it and publish the Tags property.", "evidence": "Only when you manually publish the Tags property is your Content Analytics configuration effectively deployed and data collection started."}, "CA05": {"id": "CA05", "name": "Content Analytics reporting and training", "unit": "one-time", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/content-analytics/report/report", "src": "Experience League: Content Analytics Reporting", "origin": "research", "scope": "Set up the Content Analytics Workspace template and core freeform reports with thumbnails and previews, and train analysts and content teams to read attribute insights.", "evidence": "A specific Workspace template is available, so you can immediately access a pre-populated Workspace project with relevant content insights."}, "CA06": {"id": "CA06", "name": "Monthly content performance insights", "unit": "monthly", "low": 8, "base": 16, "high": 32, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/content-analytics/content-analytics", "src": "Experience League: Content Analytics Overview", "origin": "research", "scope": "Each month, review which assets and attributes drive engagement and conversion, flag underused or overused assets, and feed the findings into the content plan.", "evidence": "These insights help you to see whether assets are underused or overused on your web and mobile properties."}, "CA03": {"id": "CA03", "name": "Experience versioning on web pages", "unit": "one-time", "low": 8, "base": 16, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/content-analytics/configuration/manual", "src": "Experience League: Content Analytics Manual Configuration", "origin": "research", "scope": "Where page experiences are captured, add the adobe.getContentExperienceVersion function to the analyzed pages so page changes are recorded as new experiences.", "evidence": "you should consider implementing versioning to ensure new experiences (changes to your web page) are properly collected"}, "CA04": {"id": "CA04", "name": "Paid media channel setup", "unit": "one-time", "low": 16, "base": 40, "high": 80, "url": "https://experienceleague.adobe.com/en/docs/analytics-platform/using/content-analytics/configuration/paid-media", "src": "Experience League: Content Analytics Paid Media Automatic Configuration", "origin": "research", "scope": "Enable the paid media channel on the ad datasets from Experience Platform's ad network source connectors, then map tracking keys so ad content links to site conversions.", "evidence": "The correlation between your experience event data and paid media data requires customer-specific tracking-key mapping and reporting configuration."}, "CO01": {"id": "CO01", "name": "Collaboration access and roles setup", "unit": "one-time", "low": 16, "base": 24, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/quick-start-guide", "src": "Experience League: Real-Time CDP Collaboration quick start guide", "origin": "research", "scope": "Grant administrator access, create Permissions roles that include the View Profiles and View Segments permissions audience sourcing needs, add sandboxes, assign users and confirm each one can open Collaboration.", "evidence": "Your organization's access roles determine what users can see and do in Collaboration."}, "CO02": {"id": "CO02", "name": "Account, branding and match key setup", "unit": "one-time", "low": 24, "base": 40, "high": 64, "url": "https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/quick-start-guide", "src": "Experience League: Real-Time CDP Collaboration quick start guide", "origin": "research", "scope": "Agree the match key strategy with the client, create the advertiser or publisher account, add the name, description, logo and contact email, and configure the match keys used to align audiences.", "evidence": "Define your account's role in Collaboration, provide branding assets, and configure match keys to align audiences across connections."}, "CO04": {"id": "CO04", "name": "Collaborator connections and first projects", "unit": "one-time", "low": 24, "base": 40, "high": 72, "url": "https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/quick-start-guide", "src": "Experience League: Real-Time CDP Collaboration quick start guide", "origin": "research", "scope": "Find publishers in the Connect workspace or send private invitations, agree connection settings such as use cases and credit consumption, confirm the connection and set up the first project with Discover, Activate and Measure.", "evidence": "involves sending or receiving invitations, reviewing and submitting connection settings (such as use cases and credit consumption)"}, "CO05": {"id": "CO05", "name": "Overlap and measurement reporting enablement", "unit": "one-time", "low": 16, "base": 32, "high": 56, "url": "https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/overview/use-cases", "src": "Experience League: Collaboration use cases", "origin": "research", "scope": "Train the client team to read audience overlap insights, pick audiences to activate, add campaign IDs and create campaign summary and attribution reports in the Measure workspace.", "evidence": "Get insight into overlap percentages and the number of overlapping identities between your audiences and those of your collaborators."}, "CO06": {"id": "CO06", "name": "Monthly collaboration operations", "unit": "monthly", "low": 12, "base": 20, "high": 32, "url": "https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/quick-start-guide", "src": "Experience League: Real-Time CDP Collaboration quick start guide", "origin": "research", "scope": "Each month, add or retire audiences, tune refresh schedules to manage credit use, set up projects for new campaigns and run overlap and measurement reports with collaborators.", "evidence": "You can add or remove audiences and update the refresh schedule directly in Collaboration."}, "CO03": {"id": "CO03", "name": "Audience sourcing from cloud data sources", "unit": "one-time", "low": 24, "base": 48, "high": 96, "url": "https://experienceleague.adobe.com/en/docs/real-time-cdp-collaboration/using/quick-start-guide", "src": "Experience League: Real-Time CDP Collaboration quick start guide", "origin": "research", "scope": "For audiences kept outside Experience Platform, prepare files to Adobe's audience specification with SHA256-hashed identifiers and the required metadata, then set up the Amazon S3, Google Cloud Storage or Snowflake data connection.", "evidence": "Cloud-based audience files must follow the required schema outlined in the Audience Specification PDF."}, "MM01": {"id": "MM01", "name": "Access, roles and sandbox setup", "unit": "one-time", "low": 16, "base": 24, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/mix-modeler/using/administration", "src": "Experience League: Marketing Campaign Analytics administration", "origin": "research", "scope": "Create the Permissions role with the Marketing Campaign Analytics resource and its harmonized data, model and plan permissions, add the sandboxes and dataset and schema permissions, and assign users.", "evidence": "For Marketing Campaign Analytics to function properly, you must set the correct permissions."}, "MM02": {"id": "MM02", "name": "Marketing data ingestion and schemas", "unit": "one-time", "low": 60, "base": 120, "high": 240, "url": "https://experienceleague.adobe.com/en/docs/mix-modeler/using/ingest-data/overview", "src": "Experience League: Ingest data overview (Marketing Campaign Analytics)", "origin": "research", "scope": "Model schemas on the XDM ExperienceEvent or Summary Metrics classes, then ingest channel spend and effort, conversions and internal and external factors with consistent dates, granularity and channel fields, and validate the loads.", "evidence": "Date and granularity are mandatory fields in the underlying schema for all aggregate data ingested as datasets"}, "MM03": {"id": "MM03", "name": "Harmonized data, touchpoints and conversions", "unit": "one-time", "low": 40, "base": 80, "high": 140, "url": "https://experienceleague.adobe.com/en/docs/mix-modeler/using/harmonize-data/overview", "src": "Experience League: Harmonize datasets overview (Marketing Campaign Analytics)", "origin": "research", "scope": "Define harmonized fields, write dataset rules for each aggregate, event and factor dataset, define marketing touchpoints and conversions, then sync and check the harmonized data.", "evidence": "Set up dataset rules to map fields from your aggregate (factor or summary) or experience event datasets to harmonized fields."}, "MM04": {"id": "MM04", "name": "Model build, training and validation", "unit": "one-time", "low": 40, "base": 80, "high": 140, "url": "https://experienceleague.adobe.com/en/docs/mix-modeler/using/models/overview", "src": "Experience League: Models overview (Marketing Campaign Analytics)", "origin": "research", "scope": "Configure models with the conversion, touchpoints, lookback and training windows, factors and priors, turn on multi-touch attribution or full funnel modeling where agreed, and retrain until the fit suits the business.", "evidence": "Retraining and rescoring are an iterative process as new findings and information emerge and adjustments are needed"}, "MM05": {"id": "MM05", "name": "Budget plans and team enablement", "unit": "one-time", "low": 24, "base": 40, "high": 72, "url": "https://experienceleague.adobe.com/en/docs/mix-modeler/using/plans/overview", "src": "Experience League: Plans overview (Marketing Campaign Analytics)", "origin": "research", "scope": "Build the first budget plans with flight dates and channel constraints, compare scenarios, and train marketing and finance users to read model and plan insights.", "evidence": "Plans in Marketing Campaign Analytics allow you to allocate budgets by business unit and channel."}, "MM06": {"id": "MM06", "name": "Monthly data refresh, rescoring and plans", "unit": "monthly", "low": 16, "base": 24, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/mix-modeler/using/models/overview", "src": "Experience League: Models overview (Marketing Campaign Analytics)", "origin": "research", "scope": "Each month, load new spend, conversion and factor data, rescore or retrain models, rebuild plans on the rescored models and report ROI and budget shifts to stakeholders.", "evidence": "data may be added to the model which requires you to rescore the model manually."}, "GS01": {"id": "GS01", "name": "Provisioning, roles and Brands permissions", "unit": "one-time", "low": 16, "base": 24, "high": 40, "url": "https://experienceleague.adobe.com/en/docs/genstudio-for-performance-marketing/user-guide/get-started", "src": "Experience League: Get started with GenStudio for Performance Marketing", "origin": "research", "scope": "Assign GenStudio licenses in the Admin Console to system managers, editors and collaborators, and create the user group and Admin Console project that Brands permissions need.", "evidence": "System administrators must complete additional set-up tasks before collaborators can edit or create Brands."}, "GS02": {"id": "GS02", "name": "Brand, product and persona guidelines", "unit": "one-time", "low": 32, "base": 56, "high": 96, "url": "https://experienceleague.adobe.com/en/docs/genstudio-for-performance-marketing/user-guide/get-started", "src": "Experience League: Get started with GenStudio for Performance Marketing", "origin": "research", "scope": "Gather and tidy the client's brand, product and persona documents, upload or enter them with channel guidelines, logos, colors and tone of voice, then test generated output and publish.", "evidence": "Content editors and collaborators cannot begin their work until the foundational elements of your organization's brand iden function cardHTML(k,id){
  const o=k==='p'?P[id]:CBY[id],key=k+':'+id;
  const listed=[...o.lines,...o.more.filter(l=>lineOn(l))],extra=o.more.filter(l=>!lineOn(l));
  const {t,n}=ownerTotal(o),defOff=o.lines.filter(l=>!lineOn(l)).length;
  let h=`<div class="k"><span>${k==='p'?'Product services':'Connection'}</span><button class="close" data-close aria-label="Close">${I.x}</button></div>`;
  h+=`<h4>${esc(k==='p'?o.title:P[o.a].name+' + '+P[o.b].name)}</h4>`;
  if(k==='c'){
    if(o.gain)h+=`<div class="sec">What you get together</div><p class="gain"><b>${esc(o.gain.title)}</b>${esc(o.gain.text)}</p>`;
    if(o.flows&&o.flows.length)h+=`<div class="sec">How the data flows</div>`+o.flows.map(f=>{const ok=(f.needs||[]).every(has);return `<div class="flow${ok?'':' wait'}"><div class="fl"><span class="pc">${esc(short(f.from))}</span>${I.arrow}<span class="pc">${esc(short(f.to))}</span></div><div class="fw">${esc(f.what)}${ok?'':` <em>Needs ${f.needs.map(n=>esc(P[n].name)).join(' and ')}, which is not in this play.</em>`}<a class="src" href="${esc(f.source.url)}" target="_blank" rel="noopener" title="Source: ${esc(f.source.title)}" aria-label="Source: ${esc(f.source.title)}">${I.ext}</a></div></div>`;}).join('');
    else h+=`<p class="how">${esc(o.how)}<a class="src" href="${esc(o.source.url)}" target="_blank" rel="noopener" title="Source: ${esc(o.source.title)}" aria-label="Source: ${esc(o.source.title)}">${I.ext}</a></p>`;
    h+=`<div class="sec">Services on this connection</div>`;
  }
  if(!listed.length&&!extra.length)h+=k==='c'?`<p class="none">Adobe Experience League does not explicitly list any services for this connection. You can add your own services on the Services tab.</p>`:`<p class="none">No services for ${esc(o.name)} itself in the catalog yet. The work sits on its connections.</p>`;
  h+=listed.map(l=>row(l,false)).join('');
  if(extra.length)h+=`<details class="more" data-more="${key}"${moreOpen[key]?' open':''}><summary>More services (${extra.length}) ${I.chev}</summary>${extra.map(l=>row(l,true)).join('')}</details>`;
  if(listed.length||extra.length)h+=`<div class="ft"><span>${defOff?`${n} of ${n+defOff} services`:`${n} service${n===1?'':'s'}`}</span><span>${st.rate?money(t):''}</span></div>`;
  return h;}
function refreshCard(){if(!card)return;const box=$('card');box.innerHTML=cardHTML(card.k,card.id);applyHot();placeCard();}

/* ---------- actions ---------- */
$('card').addEventListener('mouseenter',()=>clearTimeout(hideT));
$('card').addEventListener('mouseleave',()=>{if(!pinned)hideT=setTimeout(()=>hideCard(),260);});
$('card').addEventListener('click',e=>{e.stopPropagation();
  const t=e.target.closest('[data-t]');if(t){const l=t.dataset.t;st.ls[l]=!lineOn(l);if(st.ls[l]===DEF[l])delete st.ls[l];pinned=true;save();refreshCard();totalsUI();hintUI();return;}
  if(e.target.closest('[data-close]')){hideCard(true);return;}
  const sm=e.target.closest('summary');if(sm){const d=sm.parentElement;setTimeout(()=>{moreOpen[d.dataset.more]=d.open;placeCard();},0);pinned=true;}});
function openMenu(open){$('play-menu').hidden=!open;$('play-btn').setAttribute('aria-expanded',!!open);}
$('play-btn').addEventListener('click',e=>{e.stopPropagation();openMenu($('play-menu').hidden);});
function pick(e){e.stopPropagation();const b=e.target.closest('[data-play]');if(!b)return;st.play=b.dataset.play;st.ls={};moreOpen={};openMenu(false);render();}
$('play-menu').addEventListener('click',pick);
$('picker').addEventListener('click',pick);
document.addEventListener('click',()=>{openMenu(false);if(pinned)hideCard(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){openMenu(false);hideCard(true);$('confirm').hidden=true;}});
$('rate').addEventListener('input',e=>{const v=e.target.value.replace(/[^0-9]/g,'').slice(0,4);e.target.value=v;st.rate=v?parseInt(v,10):0;save();totalsUI();refreshCard();});
$('size').addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(!b)return;st.size=b.dataset.size;save();totalsUI();refreshCard();});
/* Start over and Change play both clear the play and every service choice; rate and size stay */
const ASK={over:['Start over?','This clears the play and every service choice. Your rate and size stay.','Clear the canvas'],
  change:['Change the play?','One play per statement of work, so this clears the canvas and every service choice. Your rate and size stay.','Choose another play']};
function ask(k){const [t,p,y]=ASK[k];$('confirm-title').textContent=t;$('confirm-text').textContent=p;$('confirm-yes').textContent=y;$('confirm').hidden=false;$('confirm-yes').focus();}
$('start-over').addEventListener('click',e=>{e.stopPropagation();ask('over');});
$('change-play').addEventListener('click',e=>{e.stopPropagation();ask('change');});
$('confirm-no').addEventListener('click',()=>{$('confirm').hidden=true;});
$('confirm').addEventListener('click',e=>{if(e.target===e.currentTarget)$('confirm').hidden=true;});
$('confirm-yes').addEventListener('click',()=>{$('confirm').hidden=true;hideCard(true);st.play=null;st.ls={};moreOpen={};render();});
let toastT=0;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},4200);}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();if(b.dataset.tab!=='build')toast('Prototype: only the Build tab works here. In the real tool, '+b.textContent+' opens with these same services.');}));
$('save').addEventListener('click',e=>{e.stopPropagation();const t=totals();toast(`Prototype: in the real tool, Scope opens next, and these ${t.n} services carry into Services and the statement of work.`);});
window.addEventListener('resize',()=>{fit();setTimeout(placeCard,380);});
render();
document.fonts&&document.fonts.ready.then(()=>{window.READY=true;});
</script>
</body></html>
